<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda Oficial Boca Juniors</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header id="header">
  <img
    id="header-img"
    src="https://upload.wikimedia.org/wikipedia/commons/thumb/7/77/Club_Atl%C3%A9tico_Boca_Juniors_logo_%2870_stars%29.png/250px-Club_Atl%C3%A9tico_Boca_Juniors_logo_%2870_stars%29.png"
    alt="Escudo de Boca Juniors"
  >
  <nav id="nav-bar">
    <a class="nav-link" href="#productos">Productos</a>
    <a class="nav-link" href="#video-section">Video</a>
    <a class="nav-link" href="#contact">Contacto</a>
  </nav>
</header>
<main>
  <section id="productos">
    <h2>Tienda Oficial de Boca</h2>
    <p>Llevá los colores del Xeneize a todos lados. Camisetas, buzos, gorras y más.</p>
    <p>Envíos a todo el país y atención personalizada.</p>
  </section>
  <section id="video-section">
    <h2>La Bombonera</h2>
    <iframe
      id="video"
      width="560"
      height="315"
      src="https://www.youtube.com/embed/PkZNo7MFNFg"
      title="La Bombonera"
      allowfullscreen>
    </iframe>
  </section>
  <section id="contact">
    <h2>Recibí novedades</h2>
    <p>Suscribite para recibir ofertas exclusivas de la tienda oficial.</p>
    <form id="form" action="https://www.freecodecamp.com/email-submit">
      <input
        id="email"
        name="email"
        type="email"
        placeholder="Ingresá tu correo"
        required
      >
      <input id="submit" type="submit" value="Suscribirme">
    </form>
  </section>
</main>
</body>
</html>
